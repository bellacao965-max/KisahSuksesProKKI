<div id="youtube" class="tab">
  <h2>YouTube Player + Search</h2>

  <input id="ytSearch" placeholder="Cari video YouTube..." />

  <button class="primary" onclick="searchYouTube()">Search</button>
  <button class="primary" onclick="randomVideo()">Random</button>

  <div id="ytPlayerBox" style="margin-top:12px;">
    <iframe
      id="ytPlayer"
      width="100%"
      height="300"
      style="border-radius:10px"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      allowfullscreen>
    </iframe>
  </div>
</div>
